services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app: {condition: service_healthy}
    environment:
      LOGIT_CADDY_SITES: ${LOGIT_CADDY_SITES:?}
      LOGIT_PORT_SUFFIX: ${LOGIT_PORT_SUFFIX:-}
      LOGIT_DEFAULT_SNI: ${LOGIT_DEFAULT_SNI:?}
    ports:
      - "${LOGIT_HTTP_PORT:-80}:80"
      - "${LOGIT_PUBLIC_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    networks: [internal]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]

volumes:
  caddy:
