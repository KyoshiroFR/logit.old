{% extends "admin/change_list.html" %}

{% block result_list %}
  {% if cl.result_count %}
    {{ block.super }}
  {% else %}
    <p class="admin-empty-list">{% if cl.query or cl.has_active_filters %}Aucun résultat pour cette recherche ou ces filtres.{% else %}Aucun élément enregistré.{% endif %}</p>
  {% endif %}
{% endblock %}
