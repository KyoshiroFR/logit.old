name: ${LOGIT_INSTANCE:-logit-preprod}
services:
  app:
    container_name: ${LOGIT_INSTANCE:-logit-preprod}-app
    image: logit:${LOGIT_IMAGE_TAG:-preprod}
    build: .
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Définir DJANGO_SECRET_KEY dans .env}
      LOGIT_HOST: ${LOGIT_HOST:-localhost}
      LOGIT_DB: /data/logit.sqlite3
    volumes:
      - sql:/data
    healthcheck:
      test: ["CMD", "python", "deploy/check_ready.py"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - private
  proxy:
    container_name: ${LOGIT_INSTANCE:-logit-preprod}-proxy
    image: caddy:2-alpine
    profiles: [proxy]
    depends_on: [app]
    environment:
      LOGIT_HOST: ${LOGIT_HOST:-localhost}
      LOGIT_HTTPS_PORT: ${LOGIT_HTTPS_PORT:-6321}
    ports:
      - "${LOGIT_BIND_IP:-127.0.0.1}:${LOGIT_HTTP_PORT:-6320}:80"
      - "${LOGIT_BIND_IP:-127.0.0.1}:${LOGIT_HTTPS_PORT:-6321}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - tls:/data
    networks:
      - private
volumes:
  sql:
    name: ${LOGIT_INSTANCE:-logit-preprod}-sql
  tls:
    name: ${LOGIT_INSTANCE:-logit-preprod}-tls
networks:
  private:
    name: ${LOGIT_INSTANCE:-logit-preprod}-net
